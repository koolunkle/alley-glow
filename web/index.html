<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1B2D">
<title>이 골목은 지금 청소 중</title>
<!-- 앱과 같은 Pretendard(OFL). 못 받으면 아래 시스템 글꼴 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --navy: #0F1B2D; --surface: #182840; --raised: #22344F; --line: #2A3D5C;
    --lime: #C6F432; --ink: #F2F5F9; --muted: #A9B6C8; --warn: #FFB547;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--navy); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
    word-break: keep-all; /* 한글을 단어 중간에서 끊지 않음 */
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
  p { margin: 0; }

  /* 상단: 서비스 이름 + 상태 칩(앱 근무 중 화면과 같은 모양) */
  header { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .brand { color: var(--lime); font-size: 20px; font-weight: 900; letter-spacing: -0.2px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
  .lead { color: var(--muted); font-size: 15px; padding: 4px 2px 8px; }

  .card { background: var(--surface); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
  .overline { color: var(--muted); font-size: 13px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 900; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 15px; }
  /* 작은 연두 라벨(앱의 '지금 광고'·'추천 1위'와 같은 모양) */
  .tag { align-self: flex-start; background: var(--lime); color: var(--navy); font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .benefit-text { font-size: 22px; font-weight: 900; letter-spacing: -0.3px; margin-top: 4px; }
  .phrase { margin-top: 6px; padding: 10px 12px; border-radius: 12px; background: var(--navy); font-size: 15px; }
  .phrase strong { color: var(--ink); }

  .button {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 28px;
    background: var(--lime); color: var(--navy); font-size: 16px; font-weight: 700; text-decoration: none;
  }
  .button svg { width: 20px; height: 20px; fill: currentColor; }

  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend { padding: 0; font-size: 16px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .scores { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .scores button {
    min-height: 52px; border-radius: 16px; border: 0; background: var(--navy);
    color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .scores button:active { background: var(--raised); }
  .scores button:focus-visible, .button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .scores button:disabled { opacity: 0.5; cursor: default; }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .thanks { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
  .thanks .check { width: 32px; height: 32px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; flex: none; }
  .thanks .check svg { width: 20px; height: 20px; fill: var(--navy); }

  /* 상태·오류 안내(앱의 InlineNotice: 본문색 글자 + 주황 아이콘) */
  .notice { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--surface); font-size: 15px; }
  .notice svg { width: 18px; height: 18px; fill: var(--warn); flex: none; display: none; }
  .notice.warn svg { display: block; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">Alley Glow</span>
    <span class="chip"><span class="dot" aria-hidden="true"></span>이 골목은 지금 청소 중</span>
  </header>
  <p class="lead">클린 워커가 지금 이 거리를 치우고 있어요. 오늘 밤 청소는 아래 가게가 함께합니다.</p>

  <p id="status" class="notice" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    <span id="status-text">가게 정보를 불러오고 있어요…</span>
  </p>

  <section id="shop" class="card" hidden>
    <span class="overline">오늘 밤 청소를 함께하는 가게</span>
    <h1 id="name"></h1>
    <p id="intro" class="sub" hidden></p>
    <p id="menu" class="sub" hidden></p>
  </section>

  <section id="benefit" class="card" hidden>
    <span class="tag">오늘의 혜택</span>
    <p id="benefit-text" class="benefit-text"></p>
    <p class="phrase"><strong>“클린 워커 보고 왔어요”</strong>라고 말해 주세요</p>
  </section>

  <a id="directions" class="button" hidden target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
    카카오맵으로 길찾기
  </a>

  <section id="rate-card" class="card" hidden>
    <form id="rate">
      <fieldset>
        <legend>이 거리, 평소보다 깨끗한가요?</legend>
        <p class="hint">눌러서 알려 주시면 거리 청소에 반영돼요</p>
        <div class="scores">
          <button type="submit" value="1" aria-label="1점, 더러워요">1</button>
          <button type="submit" value="2" aria-label="2점">2</button>
          <button type="submit" value="3" aria-label="3점">3</button>
          <button type="submit" value="4" aria-label="4점">4</button>
          <button type="submit" value="5" aria-label="5점, 아주 깨끗해요">5</button>
        </div>
        <div class="scale" aria-hidden="true"><span>더러워요</span><span>아주 깨끗해요</span></div>
      </fieldset>
    </form>
    <p id="thanks" class="thanks" role="status" aria-live="polite" hidden>
      <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
      알려 주셔서 고마워요
    </p>
    <p id="rate-error" class="notice warn" role="status" aria-live="polite" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span>평가를 저장하지 못했어요. 다시 눌러 주세요.</span>
    </p>
  </section>

</main>

<!-- SUPABASE_URL, SUPABASE_KEY(publishable). git에 올리지 않고 배포 때 GitHub Secrets로 만든다 -->
<script src="config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  /** Supabase 함수 호출. 익명은 테이블에 직접 접근하지 못하고 qr_visit·qr_rate만 쓴다 */
  async function rpc(name, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(String(res.status));
    return res.json();
  }

  // 화면에 넣는 값은 모두 textContent로(가게 정보에 HTML이 섞여도 실행되지 않게)
  function show(id, text) {
    const el = $(id);
    if (!text) return;
    el.textContent = text;
    el.hidden = false;
  }

  function fail(message) {
    $('status-text').textContent = message;
    $('status').classList.add('warn');
  }

  async function load() {
    const code = new URLSearchParams(location.search).get('s');
    if (!code || typeof SUPABASE_URL === 'undefined') return fail('가게 QR을 다시 스캔해 주세요.');
    let shop;
    try {
      shop = await rpc('qr_visit', { p_code: code });
    } catch (e) {
      return fail('정보를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.');
    }
    if (!shop) return fail('등록되지 않은 가게 QR이에요.');

    $('status').hidden = true;
    document.title = `${shop.name} · 이 골목은 지금 청소 중`;
    show('name', shop.name);
    $('shop').hidden = false;
    show('intro', shop.intro);
    show('menu', shop.menu);
    if (shop.benefit) {
      $('benefit-text').textContent = shop.benefit;
      $('benefit').hidden = false;
    }
    const directions = $('directions');
    directions.href = `https://map.kakao.com/link/to/${encodeURIComponent(shop.name)},${shop.lat},${shop.lng}`;
    directions.hidden = false;

    const form = $('rate');
    const buttons = form.querySelectorAll('button');
    $('rate-card').hidden = false;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const score = Number(event.submitter?.value);
      buttons.forEach((b) => { b.disabled = true; });
      let ok = false;
      try {
        ok = await rpc('qr_rate', { p_scan_id: shop.scan_id, p_score: score });
      } catch (e) { /* 아래 안내 */ }
      form.hidden = ok;
      $('thanks').hidden = !ok;
      $('rate-error').hidden = ok;
      if (!ok) buttons.forEach((b) => { b.disabled = false; });
    });
  }

  load();
</script>
</body>
</html>
