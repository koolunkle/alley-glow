# QR 랜딩 웹(web/)을 GitHub Pages로 배포. Supabase 접속 정보는 git이 아니라 Secrets에서 config.js로 만든다
name: QR 랜딩 웹 배포

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: config.js 생성
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          printf "const SUPABASE_URL = '%s';\nconst SUPABASE_KEY = '%s';\n" "$SUPABASE_URL" "$SUPABASE_KEY" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
