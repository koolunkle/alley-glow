# QR 랜딩 웹(web/)을 GitHub Pages로 배포. Supabase 접속 정보는 git이 아니라 Secrets에서 config.js로 만든다
name: QR 랜딩 웹 배포

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 도중 끊지 않음(진행 중인 배포를 취소하면 Pages가 어중간한 상태로 남을 수 있음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 업로드와 배포를 job으로 나눔: 같은 job에서 바로 배포하면 방금 올린 아티팩트를 API가 아직 못 찾아 실패할 때가 있음
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: config.js 생성
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          printf "const SUPABASE_URL = '%s';\nconst SUPABASE_KEY = '%s';\n" "$SUPABASE_URL" "$SUPABASE_KEY" > web/config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
