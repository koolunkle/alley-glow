# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트를 일시 정지하므로 사흘마다 읽기 요청 1건을 보냄
# GitHub는 공개 저장소에 60일간 커밋이 없으면 예약 워크플로를 끄므로, 그 뒤에는 Actions 탭에서 다시 켬
name: Supabase 일시 정지 방지

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: zones 1행 읽기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          curl -fsS -o /dev/null "$SUPABASE_URL/rest/v1/zones?select=grid_id&limit=1" -H "apikey: $SUPABASE_KEY"
